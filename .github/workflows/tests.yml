name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '10.*', testbench: '^8.0' }
          - { php: '8.3', laravel: '10.*', testbench: '^8.0' }
          - { php: '8.4', laravel: '10.*', testbench: '^8.0' }
          - { php: '8.2', laravel: '11.*', testbench: '^9.0' }
          - { php: '8.3', laravel: '11.*', testbench: '^9.0' }
          - { php: '8.4', laravel: '11.*', testbench: '^9.0' }
          - { php: '8.3', laravel: '12.*', testbench: '^10.0' }
          - { php: '8.4', laravel: '12.*', testbench: '^10.0' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
